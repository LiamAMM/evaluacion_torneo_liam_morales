<html>

<head>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header>
        <h1>Dashboard de Torneos Gamer</h1>
    </header>
    <section id="torneos">
        <h2>Registro de Torneos</h2>

        <input type="text" id="txtNombreTorneo" placeholder="Nombre del torneo">
        <br>
        <span id="msgNombreTorneo"></span>
        <br>
        <input type="text" id="txtCategoria" placeholder="Categoría">
        <br>
        <span id="msgCategoria"></span>
        <br>
        <input type="text" id="txtParticipantes" placeholder="Participantes">
        <br>
        <span id="msgParticipantes"></span>
        <br>
        <input type="text" id="txtValorInscripcion" placeholder="Valor de inscripción">
        <br>
        <span id="msgValorInscripcion"></span>
        <br>
        <input type="text" id="txtEmail" placeholder="Email del organizador">
        <br>
        <span id="msgEmail"></span>
        <br>

        <button onclick="registrarTorneo()">Registrar Torneo</button>

        <table>
            <thead>
                <tr>
                    <th>Nombre del torneo</th>
                    <th>Categoría</th>
                    <th>Participantes</th>
                    <th>Valor inscripción</th>
                    <th>Email</th>
                    <th>Recaudacion Estimada</th>
                </tr>
            </thead>
            <tbody id="tablaParticipantes">
            </tbody>
        </table>
    </section>
    <script src="dashboard.js"></script>
    <script src="utilitarios.js"></script>
</body>

</html>
